apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-demo
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-demo
  template:
    metadata:
      labels:
        app: prometheus-demo
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:main-distroless
          ports:
            - containerPort: 9090
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-demo
  namespace: monitoring
spec:
  selector:
    app: prometheus-demo
  ports:
    - port: 9090
      targetPort: 9090
      protocol: TCP
  type: ClusterIP
